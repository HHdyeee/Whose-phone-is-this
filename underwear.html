
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b2c7d9">
<title>underwear</title>

<style>
:root {
  --kakao:#fee500;
  --chat-bg:#b2c7d9;
  --ink:#191919;
  font-family:-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Noto Sans KR",
    "Malgun Gothic","PingFang SC",sans-serif;
  color:var(--ink);
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  padding:0;
  margin:0;
  min-height:100%;
  overflow:hidden;
}

body {
  background:radial-gradient(circle at 18% 20%,#e8edf4 0,transparent 42%),
    linear-gradient(140deg,#ced6df,#e7e1dc);
  display:flex;
  align-items:center;
  justify-content:center;
}

button,input {font:inherit}
button {cursor:pointer}
svg {display:block}
[hidden] {display:none!important}

.phone {
  position:relative;
  width:min(430px,100vw);
  height:min(876px,96dvh);
  min-height:500px;
  overflow:hidden;
  background:#fff;
  border-radius:36px;
  box-shadow:0 24px 70px rgba(15,28,46,.25);
  display:flex;
  flex-direction:column;
  isolation:isolate;
}

/* Status bar */

.status-bar {
  height:47px;
  min-height:47px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 24px 0;
  font-size:14px;
  font-weight:700;
  z-index:3;
  user-select:none;
}

.status-bar.is-room {
  background:var(--chat-bg);
}

.status-icons {
  display:flex;
  align-items:center;
  gap:5px;
}

.status-icons svg {
  width:18px;
  height:16px;
  fill:currentColor;
}

.status-icons .battery {
  width:25px;
  height:14px;
}

/* Chat list */

.screen {
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
}

.list-header {
  height:70px;
  min-height:70px;
  padding:12px 21px 8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.list-title {
  font-size:27px;
  font-weight:760;
  letter-spacing:-1.3px;
}

.list-tools {
  display:flex;
  align-items:center;
  gap:17px;
}

.icon-btn {
  background:transparent;
  border:0;
  padding:4px;
  display:grid;
  place-items:center;
  color:#252525;
}

.icon-btn svg {
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.list-filter {
  margin:5px 19px 12px;
  display:flex;
  gap:18px;
  height:36px;
  align-items:center;
  font-weight:650;
  font-size:15px;
}

.list-filter .chosen {
  color:#181818;
  position:relative;
}

.list-filter .chosen:after {
  content:"";
  height:3px;
  width:100%;
  position:absolute;
  bottom:-8px;
  left:0;
  background:#1c1c1c;
  border-radius:3px;
}

.list-filter span:not(.chosen) {
  color:#9a9a9a;
}

.list-body {
  flex:1;
  overflow:auto;
}

.chat-entry {
  display:flex;
  align-items:center;
  width:100%;
  gap:12px;
  text-align:left;
  background:#fff;
  border:0;
  padding:16px 19px 15px;
  min-height:88px;
}

.chat-entry:active {
  background:#f7f7f7;
}

.avatar {
  flex:none;
  position:relative;
  overflow:hidden;
  border-radius:14px;
  background:linear-gradient(145deg,#a69687,#d9c4b5 54%,#9c9691);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:18px;
  font-weight:700;
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 38%;
  position:absolute;
  inset:0;
  display:none;
}

.avatar.has-photo img {
  display:block;
}

.avatar.large {
  width:55px;
  height:55px;
  border-radius:17px;
}

.avatar.small {
  width:38px;
  height:38px;
  border-radius:13px;
  font-size:13px;
}

.entry-main {
  min-width:0;
  flex:1;
}

.entry-title {
  font-size:16px;
  line-height:1.5;
  font-weight:650;
}

.entry-last {
  color:#969696;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
  margin-top:5px;
}

.entry-side {
  align-self:flex-start;
  display:flex;
  flex-direction:column;
  gap:9px;
  align-items:flex-end;
  margin-top:3px;
}

.entry-time {
  font-size:10.8px;
  color:#a4a4a4;
  white-space:nowrap;
}

.unread-badge {
  min-width:18px;
  height:18px;
  border-radius:100px;
  background:#ed5a4b;
  color:#fff;
  font-size:11px;
  display:grid;
  place-items:center;
  padding:0 4px;
}

.bottom-nav {
  height:68px;
  min-height:68px;
  border-top:1px solid #f3f3f3;
  display:flex;
  justify-content:space-around;
  align-items:center;
  color:#b8b8b8;
  background:#fafafa;
}

.nav-tab {
  width:20%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:10px;
}

.nav-tab svg {
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-tab.active {
  color:#171717;
}

.home-footer {
  height:22px;
  min-height:22px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:7px;
  background:#fafafa;
  z-index:4;
}

.home-footer.is-room {
  background:#fff;
}

.home-indicator {
  width:116px;
  height:4px;
  border-radius:99px;
  background:#171717;
}

/* Conversation */

#roomScreen {
  background:var(--chat-bg);
}

.room-header {
  height:60px;
  min-height:60px;
  padding:2px 16px 7px 17px;
  display:flex;
  align-items:center;
  gap:13px;
  background:var(--chat-bg);
  border-bottom:1px solid rgba(28,40,52,.055);
  z-index:2;
}

.back-btn svg {
  width:27px;
  height:27px;
}

.room-name {
  font-size:17px;
  font-weight:690;
  flex:1;
}

.room-side {
  display:flex;
  gap:11px;
}

.messages {
  flex:1;
  min-height:0;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:17px 12px 26px;
  scroll-behavior:smooth;
  scrollbar-width:none;
}

.messages::-webkit-scrollbar {
  display:none;
}

.day-marker {
  display:flex;
  align-items:center;
  justify-content:center;
  margin:2px auto 26px;
}

.day-marker span {
  border-radius:20px;
  background:rgba(56,72,90,.14);
  color:#f8fbfe;
  font-size:11px;
  padding:6px 13px;
}

.msg {
  display:flex;
  gap:7px;
  margin-bottom:10px;
  align-items:flex-start;
  animation:comeIn .22s ease-out both;
}

@keyframes comeIn {
  from {
    opacity:0;
    transform:translateY(9px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.msg.mine {
  justify-content:flex-end;
  margin-left:25px;
}

.msg.theirs {
  margin-right:22px;
}

.profile-slot {
  width:38px;
  flex:none;
}

.profile-name {
  font-size:12px;
  color:#253344;
  margin:0 0 6px 1px;
  font-weight:550;
}

.msg-content {
  min-width:0;
  max-width:calc(100% - 54px);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.msg.mine .msg-content {
  align-items:flex-end;
  max-width:81%;
}

.bubble-row {
  display:flex;
  align-items:flex-end;
  gap:5px;
  max-width:100%;
}

.msg.mine .bubble-row {
  flex-direction:row-reverse;
}

.bubble {
  padding:9px 11px 10px;
  font-size:15px;
  line-height:1.5;
  letter-spacing:-.35px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  max-width:100%;
  width:max-content;
  min-width:26px;
  box-shadow:0 1px 1px rgba(30,40,60,.035);
}

.msg.mine .bubble {
  background:var(--kakao);
  border-radius:12px 3px 12px 12px;
}

.msg.theirs .bubble {
  background:#fff;
  border-radius:3px 12px 12px 12px;
}

.msg-side {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-end;
  gap:3px;
  flex:none;
  padding-bottom:2px;
}

.msg.mine .msg-side {
  align-items:flex-end;
}

.unread-num {
  color:#f9e217;
  font-size:11px;
  line-height:12px;
  font-weight:700;
  min-height:12px;
}

.msg-time {
  font-size:10px;
  color:#536476;
  white-space:nowrap;
  line-height:1.15;
}

.translate-btn {
  border:0;
  background:rgba(247,250,253,.30);
  color:#465f77;
  border-radius:20px;
  padding:3px 9px;
  margin-top:4px;
  line-height:1.4;
  font-size:10px;
  display:inline-flex;
  gap:4px;
  align-items:center;
}

.translate-btn[aria-expanded="true"] {
  background:rgba(255,255,255,.63);
  color:#314457;
}

.translate-btn svg {
  width:11px;
  height:11px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.6;
}

.translation {
  font-size:12px;
  line-height:1.58;
  padding:7px 9px;
  border-radius:7px;
  background:rgba(255,255,255,.48);
  color:#36465a;
  margin-top:4px;
  max-width:100%;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

/* Composer */

.compose-panel {
  background:#fff;
  z-index:3;
}

.next-hint {
  display:flex;
  align-items:center;
  justify-content:center;
  height:29px;
  padding:0 12px;
  background:#f8f9fb;
  color:#7e8d9a;
  font-size:11px;
  gap:6px;
}

.next-hint:before {
  content:"";
  width:5px;
  height:5px;
  border-radius:50%;
  background:#e9c600;
}

.next-hint.waiting:before {
  background:#909da8;
  animation:blink 1s infinite alternate;
}

@keyframes blink {
  from {opacity:.25}
  to {opacity:1}
}

.compose-row {
  height:56px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 11px 8px;
}

.compose-plus {
  width:30px;
  height:32px;
  border:0;
  background:transparent;
  color:#929699;
  font-size:31px;
  font-weight:200;
  display:grid;
  place-items:center;
  padding:0;
}

.field-shell {
  height:38px;
  min-width:0;
  flex:1;
  border:1px solid #ededee;
  border-radius:20px;
  display:flex;
  align-items:center;
  background:#f9f9fa;
  padding-left:11px;
}

.composer-input {
  border:0;
  background:none;
  outline:none;
  width:100%;
  min-width:0;
  font-size:13px;
  padding:6px 0;
  color:#111;
  cursor:pointer;
}

.composer-input::placeholder {
  color:#acacaf;
}

.field-smile {
  background:none;
  border:0;
  color:#a5a5a5;
  padding:5px 6px;
}

.field-smile svg {
  width:21px;
  height:21px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
}

.send-btn {
  background:#f0f0f0;
  border:0;
  border-radius:10px;
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  color:#bababa;
}

.send-btn.ready {
  background:var(--kakao);
  color:#343434;
}

.send-btn svg {
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* Korean keyboard */

.keyboard {
  height:258px;
  min-height:258px;
  background:#d4d7df;
  padding:5px 4px 10px;
  user-select:none;
  animation:keyIn .16s ease-out;
}

@keyframes keyIn {
  from {
    transform:translateY(30px);
    opacity:.65;
  }
  to {
    transform:translateY(0);
    opacity:1;
  }
}

.keyboard-guide {
  height:34px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 13px;
  color:#59616f;
  font-size:13px;
}

.keyboard-guide span:nth-child(2) {
  color:#7d8792;
  font-size:11px;
}

.key-line {
  display:flex;
  justify-content:center;
  gap:4px;
  margin:4px 0 8px;
  height:43px;
}

.key {
  border:0;
  background:#fff;
  color:#222;
  border-radius:5px;
  box-shadow:0 1px 0 #a6aab3;
  flex:1;
  text-align:center;
  font-size:19px;
  padding:0;
  display:grid;
  place-items:center;
}

.key.wide {
  flex:1.38;
  background:#aeb5c1;
  font-size:15px;
}

.key.space {
  flex:4.5;
  font-size:14px;
}

.key.lang {
  font-size:12px;
}

.key.send-key {
  background:#b0b9c8;
  color:#273b53;
  flex:1.42;
  font-size:14px;
  font-weight:650;
}

.key.pressed {
  background:#f6efbd;
}

/* Menu */

.overlay {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.28);
  z-index:9;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.sheet {
  width:100%;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:19px 23px 31px;
  box-shadow:0 -8px 30px rgba(0,0,0,.12);
}

.sheet-title {
  font-weight:700;
  font-size:17px;
  margin-bottom:6px;
}

.sheet-sub {
  color:#8c8c8c;
  font-size:12px;
  margin-bottom:13px;
  line-height:1.6;
}

.sheet-action {
  width:100%;
  height:49px;
  border:0;
  border-bottom:1px solid #f1f1f1;
  text-align:left;
  background:#fff;
  color:#252525;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sheet-close {
  margin-top:10px;
  background:#f3f3f3;
  border:0;
  border-radius:10px;
  width:100%;
  height:44px;
  color:#555;
}

.toast {
  position:absolute;
  z-index:12;
  bottom:93px;
  left:50%;
  transform:translate(-50%,8px);
  max-width:85%;
  border-radius:40px;
  background:rgba(33,40,47,.87);
  color:#fff;
  padding:9px 14px;
  font-size:12px;
  text-align:center;
  opacity:0;
  transition:opacity .2s,transform .2s;
  pointer-events:none;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

.searchbox {
  padding:2px 19px 10px;
}

.searchbox input {
  width:100%;
  border:0;
  border-radius:12px;
  background:#f5f5f5;
  padding:10px 12px;
  font-size:13px;
}

@media(max-width:600px) {
  body {background:#fff}
  .phone {
    width:100%;
    height:100dvh;
    min-height:0;
    border-radius:0;
    box-shadow:none;
  }
  .status-bar {
    height:calc(38px + env(safe-area-inset-top));
    min-height:calc(38px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
  }
  .home-footer {
    height:calc(18px + env(safe-area-inset-bottom));
    min-height:calc(18px + env(safe-area-inset-bottom));
    padding-bottom:max(6px,env(safe-area-inset-bottom));
  }
  .keyboard {
    height:260px;
    min-height:260px;
  }
}

@media(max-height:650px) {
  .keyboard {
    height:214px;
    min-height:214px;
  }
  .key-line {
    height:35px;
    margin-bottom:5px;
  }
  .keyboard-guide {
    height:25px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*:before,*:after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="phone" id="phone">

  <!-- System clock -->
  <div class="status-bar" id="statusBar">
    <span id="systemClock">--:--</span>
    <div class="status-icons">
      <svg viewBox="0 0 20 16">
        <path d="M1 6.7c5-4.8 13-4.8 18 0L10 16z"/>
      </svg>
      <svg viewBox="0 0 20 16">
        <path d="M2 4.7a12.4 12.4 0 0 1 16 0l-2.2 3a8.8 8.8 0 0 0-11.6 0zm4.2 4.8a6.4 6.4 0 0 1 7.6 0L10 14z"/>
      </svg>
      <svg class="battery" viewBox="0 0 27 15">
        <rect x="1" y="1" width="22" height="13" rx="3" stroke="currentColor" stroke-width="1.3" fill="none"/>
        <rect x="3.1" y="3" width="17" height="9" rx="1.6"/>
        <path d="M24.3 5.2c1.3.2 1.8 1.3 1.8 2.3s-.5 2.1-1.8 2.3z"/>
      </svg>
    </div>
  </div>

  <!-- Chat list -->
  <section class="screen" id="listScreen">

    <div class="list-header">
      <div class="list-title">채팅</div>
      <div class="list-tools">
        <button class="icon-btn" id="searchOpen" type="button" aria-label="검색">
          <svg viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.6"/>
            <path d="m15.5 15.5 5 5"/>
          </svg>
        </button>
        <button class="icon-btn" id="listSettings" type="button" aria-label="설정">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="list-filter">
      <span class="chosen">전체</span>
      <span>안 읽음</span>
      <span>즐겨찾기</span>
    </div>

    <div class="searchbox" id="searchbox" hidden>
      <input id="searchInput" type="search" placeholder="이름 검색">
    </div>

    <main class="list-body">
      <button class="chat-entry" id="chatEntry" type="button">
        <div class="avatar large" data-avatar>
          <span>쭈</span>
          <img alt="쭈 프로필 사진">
        </div>
        <div class="entry-main">
          <div class="entry-title">쭈</div>
          <div class="entry-last" id="entryPreview">대화를 시작해 보세요</div>
        </div>
        <div class="entry-side">
          <div class="entry-time" id="entryTime"></div>
          <div class="unread-badge" id="entryUnread" hidden>1</div>
        </div>
      </button>
    </main>

    <div class="bottom-nav">
      <div class="nav-tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="7.4" r="4"/><path d="M4.5 21c.2-4.9 3.1-7.3 7.5-7.3s7.3 2.4 7.5 7.3"/></svg>
        <span>친구</span>
      </div>
      <div class="nav-tab active">
        <svg viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2.6C5.6 2.6 1.5 6.5 1.5 11c0 3 1.8 5.5 4.7 7L5 22l4.3-2.3c.9.2 1.8.3 2.7.3 6.4 0 10.5-3.9 10.5-8.5S18.4 2.6 12 2.6z"/></svg>
        <span>채팅</span>
      </div>
      <div class="nav-tab">
        <svg viewBox="0 0 24 24"><path d="M3 4.5h18v13H9l-5 3v-3H3z"/><path d="M7 9h10M7 13h7"/></svg>
        <span>오픈채팅</span>
      </div>
      <div class="nav-tab">
        <svg viewBox="0 0 24 24"><path d="M4 8h16l-1 13H5L4 8zM9 9V6a3 3 0 0 1 6 0v3"/></svg>
        <span>쇼핑</span>
      </div>
      <div class="nav-tab">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>더보기</span>
      </div>
    </div>

  </section>

  <!-- Conversation -->
  <section class="screen" id="roomScreen" hidden>

    <div class="room-header">
      <button class="icon-btn back-btn" id="goBack" type="button">
        <svg viewBox="0 0 24 24">

      </button>

      <div class="room-name">쭈</div>

      <div class="room-side">
        <button class="icon-btn" id="roomSearch" type="button">
          <svg viewBox="0 0 24 24">

            <path d="m15.5 15.5 5 5"/>
          </svg>
        </button>
        <button class="icon-btn" id="roomMenu" type="button">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>

    </div>

    <main class="messages" id="messageScroll">
      <div class="day-marker">
        <span id="dayLabel">2026년 11월 31일</span>

    <div class="compose-panel">
      <div class="next-hint" id="nextHint">
        입력창을 누르면 첫 메시지가 자동으로 입력돼요
      </div>

      <div class="compose-row">
        <button class="compose-plus" id="plusBtn" type="button">+</button>

        <div class="field-shell" id="fieldShell">
          <input class="composer-input" id="composerInput"
            type="text" inputmode="none" autocomplete="off"
            readonly placeholder="메시지 입력">
          <button class="field-smile" id="emojiBtn" type="button">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>

        <button class="send-btn" id="sendBtn" type="button">

        </button>
      </div>

      <div class="keyboard" id="keyboard" hidden>
        <div class="keyboard-guide">
          <span>‹</span>
          <span id="keyboardGuide">자동 입력</span>
          <span>⋯</span>
        </div>

        <div class="key-line">
          <button class="key" data-key="ㅂ">ㅂ</button>
          <button class="key" data-key="ㅈ">ㅈ</button>
          <button class="key" data-key="ㄷ">ㄷ</button>
          <button class="key" data-key="ㄱ">ㄱ</button>
          <button class="key" data-key="ㅅ">ㅅ</button>
          <button class="key" data-key="ㅛ">ㅛ</button>
          <button class="key" data-key="ㅕ">ㅕ</button>
          <button class="key" data-key="ㅑ">ㅑ</button>
          <button class="key" data-key="ㅐ">ㅐ</button>
          <button class="key" data-key="ㅔ">ㅔ</button>

        <div class="key-line" style="padding:0 13px">
          <button class="key" data-key="ㅁ">ㅁ</button>
          <button class="key" data-key="ㄴ">ㄴ</button>
          <button class="key" data-key="ㅇ">ㅇ</button>
          <button class="key" data-key="ㄹ">ㄹ</button>
          <button class="key" data-key="ㅎ">ㅎ</button>
          <button class="key" data-key="ㅗ">ㅗ</button>
          <button class="key" data-key="ㅓ">ㅓ</button>
          <button class="key" data-key="ㅏ">ㅏ</button>
          <button class="key" data-key="ㅣ">ㅣ</button>
        </div>

        <div class="key-line">
          <button class="key wide" data-key="shift">⇧</button>
          <button class="key" data-key="ㅋ">ㅋ</button>
          <button class="key" data-key="ㅌ">ㅌ</button>
          <button class="key" data-key="ㅊ">ㅊ</button>
          <button class="key" data-key="ㅍ">ㅍ</button>
          <button class="key" data-key="ㅠ">ㅠ</button>
          <button class="key" data-key="ㅜ">ㅜ</button>
          <button class="key" data-key="ㅡ">ㅡ</button>
          <button class="key wide" data-key="delete">⌫</button>
        </div>

        <div class="key-line">
          <button class="key wide lang" data-key="123">123</button>
          <button class="key wide lang" data-key="globe">🌐</button>
          <button class="key space" data-key="space">간격</button>
          <button class="key send-key" data-key="send">전송</button>

  </section>

  <div class="home-footer" id="homeFooter">
    <div class="home-indicator"></div>
  </div>

  <!-- Menu -->
  <div class="overlay" id="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-title">쭈 · 대화 설정</div>
      <div class="sheet-sub">
        이 페이지는 실제 카카오톡이 아닌 인터랙티브 픽션이에요.
      </div>

      <button class="sheet-action" id="sheetReplay" type="button">
        대화 처음부터 다시 보기 <span>↺</span>
      </button>

      <button class="sheet-action" id="sheetTranslations" type="button">
        번역 모두 표시 <span id="allTranslationsStatus">켜짐</span>
      </button>

      <button class="sheet-action" id="sheetPhoto" type="button">
        쭈 프로필 사진 다운로드 <span>↓</span>
      </button>

      <button class="sheet-close" id="sheetClose" type="button">
        닫기
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(() => {
  'use strict';

  // --------------------------------------
  // Story
  // me = 严成贤
  // them = 金主训
  // --------------------------------------

  const story = [
    {from:'me',ko:'김주훈, 오늘 입은 팬티 사진 한 장 찍어서 보내 줘',zh:'金主训，拍一张你今天内裤的照片给我看看'},
    {from:'them',ko:'?',zh:'？'},
    {from:'them',ko:'뭐 하게??',zh:'干什么？？'},
    {from:'them',ko:'엄성현, 너 미쳤냐??? 이 변태야!',zh:'严成贤你有病吧？？？死变态！'},
    {from:'me',ko:'나도 그걸 묻고 싶거든',zh:'我也想问你'},
   
    {from:'me',ko:'내가 그저께 입었던 팬티를 왜 지금 네가 입고 있는 건데?',zh:'为什么我前天穿的内裤现在在你身上？'},
    {from:'me',ko:'그거 내가 방금 깨끗이 빨아 놓은 거라고!',zh:'我刚洗干净的！'},
    {from:'them',ko:'……',zh:'……'},
    {from:'them',ko:'??!',zh:'？？！'},
    {from:'them',ko:'아……… 미안……………',zh:'哦………对不起……………'},
    {from:'me',ko:'너야말로 미친 거 아니야? 이 변태야!',zh:'你是不是有病啊死变态！'},
    {from:'them',ko:'잘못했어, 진짜 잘못했어',zh:'我错了我真错了'},
    {from:'them',ko:'아침에 드레스룸 들어갈 때 불 켜는 걸 깜빡했어',zh:'早上去衣帽间的时候忘记开灯了'},
    {from:'them',ko:'미안해, 진짜 미안해',zh:'对不起真对不起'},
    {from:'me',ko:'미안하면 다야?',zh:'对不起有用？'},
    {from:'them',ko:'그럼 내가 밥 살게, 어때?',zh:'那我请你吃饭行吗？'},
    {from:'me',ko:'밥만 사는 거야…',zh:'只是请吃饭啊…'},
    {from:'them',ko:'당연히 아니지',zh:'当然不是'},
    {from:'them',ko:'잠깐만 기다려 줘. 5분이면 돌아갈게',zh:'请稍等一下，我还有5分钟回来'},
    {from:'me',ko:'………',zh:'………'},
    {from:'me',ko:'날 만족시킬 만한 해결책을 가져오는 게 좋을 거야',zh:'你最好给我一个能让我满意的解决方法'},
    {from:'them',ko:'당연히 문제없지, 사랑하는 내 남자친구야😘',zh:'当然没问题亲爱的男朋友😘'},
    {from:'me',ko:'?',zh:'？'},
    {from:'me',ko:'사랑하는? 😘?',zh:'亲爱的？😘？'},
    {from:'me',ko:'으, 징그러워! 지금 무슨 낯짝으로 그런 소릴 해……',zh:'好恶心喔！你什么嘴脸嘛……'},
    {from:'them',ko:'네 비위 맞추는 낯짝이지',zh:'讨好你的嘴脸'},
    {from:'me',ko:'……',zh:'……'},
    {from:'them',ko:'나 진짜 잘못했다니까아',zh:'我真的错了嘛'},
    {from:'me',ko:'알았어. 오는 길 조심해',zh:'好吧，你路上注意安全'},
    {from:'them',ko:'응~',zh:'好～'},
    {from:'them',ko:'❤️',zh:'❤️'}
  ];

  const byId = id => document.getElementById(id);

  const els = {
    list:byId('listScreen'),
    room:byId('roomScreen'),
    chatEntry:byId('chatEntry'),
    goBack:byId('goBack'),
    statusBar:byId('statusBar'),
    homeFooter:byId('homeFooter'),
    scroll:byId('messageScroll'),
    input:byId('composerInput'),
    field:byId('fieldShell'),
    keyboard:byId('keyboard'),
    send:byId('sendBtn'),
    hint:byId('nextHint'),
    entryPreview:byId('entryPreview'),
    entryTime:byId('entryTime'),
    overlay:byId('overlay'),
    toast:byId('toast'),
    guide:byId('keyboardGuide'),
    searchInput:byId('searchInput'),
    day:byId('dayLabel')
  };

  // --------------------------------------
  // State
  // --------------------------------------

  let index=0;
  let busy=false;
  let composing=false;
  let typeTimer=null;
  let activeDraft='';
  let toastTimer=null;
  let showAll=true;
  let enteredRoom=false;
  let runId=0;

  const pendingUnreads=[];

  // --------------------------------------
  // Real device time
  // --------------------------------------

  function pad2(n) {
    return String(n).padStart(2,'0');
  }

  function formatTime(date=new Date()) {
    const hour=date.getHours();
    return `${hour<12?'오전':'오후'} ${hour%12||12}:${pad2(date.getMinutes())}`;
  }

  function renderClock() {
    const now=new Date();

    byId('systemClock').textContent =
      `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  }

  // The date is intentionally fictional.
  const fictionalDate='2026년 11월 31일';
  els.day.textContent=fictionalDate;

  renderClock();
  setInterval(renderClock,1000);

  document.addEventListener('visibilitychange',renderClock);

  // --------------------------------------
  // Helpers
  // --------------------------------------

  function later(ms) {
    return new Promise(resolve=>setTimeout(resolve,ms));
  }

  function toast(text) {
    clearTimeout(toastTimer);
    els.toast.textContent=text;
    els.toast.classList.add('show');

    toastTimer=setTimeout(()=>{
      els.toast.classList.remove('show');
    },2100);
  }

  function scrollBottom() {
    requestAnimationFrame(()=>{
      els.scroll.scrollTop=els.scroll.scrollHeight;
    });
  }

  function setReady(ready) {
    els.send.classList.toggle('ready',!!ready);
    els.send.setAttribute('aria-disabled',String(!ready));
  }

  function markRead() {
    for(const unread of pendingUnreads) {
      unread.textContent='';
      unread.removeAttribute('aria-label');
    }
    pendingUnreads.length=0;
  }

  // --------------------------------------
  // Navigation
  // --------------------------------------

  function showRoom() {
    enteredRoom=true;

    els.list.hidden=true;
    els.room.hidden=false;
    els.statusBar.classList.add('is-room');
    els.homeFooter.classList.add('is-room');

    renderClock();
    scrollBottom();
    updateHint();
  }

  function showList() {
    enteredRoom=false;
    hideKeyboard();

    els.room.hidden=true;
    els.list.hidden=false;
    els.statusBar.classList.remove('is-room');
    els.homeFooter.classList.remove('is-room');
  }

  els.chatEntry.addEventListener('click',showRoom);
  els.goBack.addEventListener('click',showList);

  // --------------------------------------
  // Composer hint
  // --------------------------------------

  function updateHint() {
    els.hint.classList.toggle('waiting',busy);

    if(index>=story.length) {
      els.hint.textContent='대화가 끝났어요 · ☰ 메뉴에서 다시 보기';
      els.input.placeholder='대화가 끝났습니다';
    } else if(busy) {
      els.hint.textContent='쭈의 답장을 기다리는 중…';
      els.input.placeholder='답장을 기다리는 중…';
    } else if(composing) {
      els.hint.textContent='메시지가 자동으로 입력됐어요 · 노란 버튼으로 전송';
      els.input.placeholder='메시지 입력';
    } else {
      els.hint.textContent=index===0
        ?'입력창을 누르면 첫 메시지가 자동으로 입력돼요'
        :'입력창을 눌러 다음 메시지를 작성하세요';

      els.input.placeholder='메시지 입력';
    }
  }

  // --------------------------------------
  // Keyboard
  // --------------------------------------

  function hideKeyboard() {
    els.keyboard.hidden=true;
    composing=false;

    if(typeTimer) {
      clearInterval(typeTimer);
      typeTimer=null;
    }

    activeDraft='';
    els.input.value='';
    setReady(false);
    els.input.blur();

    updateHint();
    scrollBottom();
  }

  function fillDraft(instant=false) {
    if(index>=story.length||busy||story[index].from!=='me')return;

    if(typeTimer) {
      clearInterval(typeTimer);
      typeTimer=null;
    }

    const full=story[index].ko;

    if(instant) {
      els.input.value=full;
      activeDraft=full;
      els.guide.textContent='입력 완료';
      setReady(true);
      updateHint();
      return;
    }

    els.input.value='';
    activeDraft='';
    setReady(false);
    els.guide.textContent='한국어 자동 입력 중…';

    const letters=Array.from(full);
    let i=0;

    typeTimer=setInterval(()=>{
      i=Math.min(i+2,letters.length);
      activeDraft=letters.slice(0,i).join('');
      els.input.value=activeDraft;

      if(i>=letters.length) {
        clearInterval(typeTimer);
        typeTimer=null;

        els.guide.textContent='전송할 준비가 됐어요';
        setReady(true);
        updateHint();
      }
    },31);
  }

  function openKeyboard() {
    if(index>=story.length) {
      toast('대화가 끝났어요. 메뉴에서 다시 시작할 수 있어요.');
      return;
    }

    if(busy) {
      toast('쭈의 답장을 기다려 주세요');
      return;
    }

    if(story[index].from!=='me'||composing)return;

    composing=true;
    els.keyboard.hidden=false;

    updateHint();
    scrollBottom();
    fillDraft();
  }

  els.input.addEventListener('click',openKeyboard);

  els.field.addEventListener('click',e=>{
    if(!e.target.closest('button'))openKeyboard();
  });

  els.input.addEventListener('keydown',e=>{
    if(e.key==='Enter') {
      e.preventDefault();
      sendCurrent();
    }
  });

  byId('emojiBtn').addEventListener('click',()=>{
    if(!composing)openKeyboard();
    else toast('이 대화는 미리 정해진 메시지로 진행돼요');
  });

  // --------------------------------------
  // Avatar
  // --------------------------------------

  const portrait='https://hhdyeee.github.io/Whose-phone-is-this/jju.png';

  function attachAvatar(el) {
    const img=el.querySelector('img');
    if(!img)return;

    img.onload=()=>{
      el.classList.add('has-photo');
    };

    img.onerror=()=>{
      el.classList.remove('has-photo');
    };

    img.src=portrait;
  }

  function refreshAvatars() {
    document.querySelectorAll('[data-avatar]').forEach(attachAvatar);
  }

  refreshAvatars();

  // --------------------------------------
  // Messages
  // --------------------------------------

  function makeMessage(item) {
    const me=item.from==='me';

    const container=document.createElement('article');
    container.className=`msg ${me?'mine':'theirs'}`;

    const prev=els.scroll.querySelector('.msg:last-of-type');
    const grouped=prev&&prev.dataset.from===item.from;

    container.dataset.from=item.from;

    if(!me) {
      const slot=document.createElement('div');
      slot.className='profile-slot';

      if(!grouped) {
        const avatar=document.createElement('div');
        avatar.className='avatar small';
        avatar.dataset.avatar='';
        avatar.innerHTML='<span>쭈</span><img alt="">';

        slot.appendChild(avatar);
        attachAvatar(avatar);
      }

      container.appendChild(slot);
    }

    const content=document.createElement('div');
    content.className='msg-content';

    if(!me&&!grouped) {
      const name=document.createElement('div');
      name.className='profile-name';
      name.textContent='쭈';
      content.appendChild(name);
    }

    const row=document.createElement('div');
    row.className='bubble-row';

    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=item.ko;

    const side=document.createElement('div');
    side.className='msg-side';

    // Actual local time at the moment the message appears.
    const sentAt=new Date();

    if(me) {
      const unread=document.createElement('span');
      unread.className='unread-num';
      unread.textContent='1';
      unread.setAttribute('aria-label','안 읽음');

      side.appendChild(unread);
      pendingUnreads.push(unread);
    }

    const time=document.createElement('span');
    time.className='msg-time';
    time.textContent=formatTime(sentAt);

    side.appendChild(time);
    row.append(bubble,side);
    content.appendChild(row);

    // Translation is expanded by default.
    const tBtn=document.createElement('button');
    tBtn.className='translate-btn';
    tBtn.type='button';
    tBtn.setAttribute('aria-expanded',String(showAll));
    tBtn.setAttribute('aria-label','중국어 번역 보기');

    tBtn.innerHTML=`
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 4h9M6.5 2v2m3 0c0 4-2.1 6.4-6.8 8.5M4.1 6.2c1.2 2.1 3.3 4.1 5.9 5.5M10.7 10.3l2 4m-4-1h6"/>
      </svg> 번역
    `;

    const translated=document.createElement('div');
    translated.className='translation';
    translated.textContent=item.zh;
    translated.hidden=!showAll;

    tBtn.addEventListener('click',()=>{
      const show=translated.hidden;

      translated.hidden=!show;
      tBtn.setAttribute('aria-expanded',String(show));
      scrollBottom();
    });

    content.append(tBtn,translated);
    container.appendChild(content);
    els.scroll.appendChild(container);

    els.entryPreview.textContent=item.ko;
    els.entryTime.textContent=formatTime(sentAt);

    scrollBottom();
  }

  // --------------------------------------
  // Reply
  // --------------------------------------

  async function replyFromJuhoon() {
    const myRun=runId;

    busy=true;
    updateHint();

    await later(1050);
    if(myRun!==runId)return;

    markRead();

    // A short pause represents the fictional five-minute return.
    // It does not change the real clock.
    if(index===21) {
      await later(2200);
    } else {
      await later(380);
    }

    if(myRun!==runId)return;

    while(index<story.length&&story[index].from==='them') {
      if(myRun!==runId)return;

      makeMessage(story[index]);
      index++;

      const delay=index>=story.length
        ?500
        :story[index].from==='them'
          ?690+Math.floor(Math.random()*380)
          :480;

      await later(delay);
    }

    if(myRun!==runId)return;

    busy=false;
    updateHint();

    if(index>=story.length)toast('❤️');
  }

  // --------------------------------------
  // Send
  // --------------------------------------

  function sendCurrent() {
    if(!composing||busy||index>=story.length||story[index].from!=='me')return;

    if(typeTimer) {
      fillDraft(true);
      return;
    }

    if(!els.input.value.trim())return;

    makeMessage(story[index]);
    index++;

    hideKeyboard();

    if(index<story.length&&story[index].from==='them') {
      replyFromJuhoon();
    } else {
      updateHint();
    }
  }

  els.send.addEventListener('click',()=>{
    if(!composing) {
      openKeyboard();
      return;
    }

    sendCurrent();
  });

  els.keyboard.addEventListener('click',e=>{
    const key=e.target.closest('[data-key]');
    if(!key)return;

    key.classList.add('pressed');
    setTimeout(()=>key.classList.remove('pressed'),110);

    const what=key.dataset.key;

    if(what==='send') {
      sendCurrent();
      return;
    }

    if(!composing)return;

    if(typeTimer)fillDraft(true);

    if(what==='delete') {
      els.input.value=Array.from(els.input.value).slice(0,-1).join('');
    } else if(what==='space') {
      els.input.value+=' ';
    } else if(['shift','123','globe'].includes(what)) {
      toast('한글 키보드 · 자동 입력 모드');
      return;
    } else {
      els.input.value+=what;
    }

    activeDraft=els.input.value;
    setReady(!!activeDraft.trim());
  });

  // --------------------------------------
  // Search / navigation
  // --------------------------------------

  byId('searchOpen').addEventListener('click',()=>{
    const panel=byId('searchbox');
    panel.hidden=!panel.hidden;

    if(!panel.hidden)els.searchInput.focus();
  });

  els.searchInput.addEventListener('input',()=>{
    const matches='쭈 김주훈 Juhoon'.toLowerCase()
      .includes(els.searchInput.value.trim().toLowerCase());

    els.chatEntry.hidden=!matches;
  });

  byId('roomSearch').addEventListener('click',()=>{
    toast('메시지 번역은 각 말풍선 아래에서 볼 수 있어요');
  });

  byId('plusBtn').addEventListener('click',()=>{
    toast('오른쪽 위 메뉴에서 프로필 사진을 다운로드할 수 있어요');
  });

  // --------------------------------------
  // Menu
  // --------------------------------------

  function openMenu() {
    els.overlay.hidden=false;
    byId('allTranslationsStatus').textContent=showAll?'켜짐':'꺼짐';
  }

  byId('roomMenu').addEventListener('click',openMenu);
  byId('listSettings').addEventListener('click',openMenu);

  byId('sheetClose').addEventListener('click',()=>{
    els.overlay.hidden=true;
  });

  els.overlay.addEventListener('click',e=>{
    if(e.target===els.overlay)els.overlay.hidden=true;
  });

  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;

    if(!els.overlay.hidden) {
      els.overlay.hidden=true;
    } else if(composing) {
      hideKeyboard();
    } else if(enteredRoom) {
      showList();
    }
  });

  // --------------------------------------
  // Replay
  // --------------------------------------

  function replay() {
    runId++;

    pendingUnreads.length=0;
    index=0;
    busy=false;

    hideKeyboard();

    els.scroll.querySelectorAll('.msg').forEach(m=>m.remove());

    els.entryPreview.textContent='대화를 시작해 보세요';
    els.entryTime.textContent='';

    // Reset translations to ON.
    showAll=true;
    byId('allTranslationsStatus').textContent='켜짐';

    // Keep fictional date, refresh only real clock.
    els.day.textContent=fictionalDate;
    renderClock();

    els.overlay.hidden=true;

    updateHint();
    scrollBottom();

    toast('처음부터 다시 시작합니다');
  }

  byId('sheetReplay').addEventListener('click',replay);

  // --------------------------------------
  // Translation toggle
  // --------------------------------------

  byId('sheetTranslations').addEventListener('click',()=>{
    showAll=!showAll;

    document.querySelectorAll('.translation').forEach(el=>{
      el.hidden=!showAll;
    });

    document.querySelectorAll('.translate-btn').forEach(el=>{
      el.setAttribute('aria-expanded',String(showAll));
    });

    byId('allTranslationsStatus').textContent=showAll?'켜짐':'꺼짐';

    scrollBottom();
  });

  // --------------------------------------
  // Download avatar
  // --------------------------------------

  byId('sheetPhoto').addEventListener('click',async()=>{
    els.overlay.hidden=true;

    try {
      const response=await fetch(portrait);

      if(!response.ok) {
        throw new Error('Image request failed');
      }

      const blob=await response.blob();
      const url=URL.createObjectURL(blob);

      const link=document.createElement('a');
      link.href=url;
      link.download='쭈_프로필.jpg';

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(()=>{
        URL.revokeObjectURL(url);
      },2000);

    } catch(error) {
      toast('프로필 사진을 다운로드할 수 없어요');
    }
  });

  updateHint();
})();
</script>

</body>
</html>
