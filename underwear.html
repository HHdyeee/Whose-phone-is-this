<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b2c7d9">
<title>쭈 · 2026년 11월 7일 토요일 오후 7:32</title>
<style>
:root{--kakao:#fee500;--chat-bg:#b2c7d9;--ink:#191919;--muted:#7a7e82;--shadow:0 12px 56px rgba(19,29,44,.15);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","PingFang SC",sans-serif;color:var(--ink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{padding:0;margin:0;min-height:100%;overflow:hidden}
body{background:radial-gradient(circle at 18% 20%,#e8edf4 0,transparent 42%),linear-gradient(140deg,#ced6df,#e7e1dc);display:flex;align-items:center;justify-content:center}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,.chat-entry:focus-visible,.composer-input:focus-visible{outline:2px solid #4c80c5;outline-offset:2px}
svg{display:block}
[hidden]{display:none!important}
.phone{position:relative;width:min(430px,100vw);height:min(876px,96dvh);min-height:500px;overflow:hidden;background:#fff;border-radius:36px;box-shadow:0 24px 70px rgba(15,28,46,.25),0 0 0 1px rgba(80,96,114,.08);display:flex;flex-direction:column;isolation:isolate}
.status-bar{height:47px;min-height:47px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:9px 24px 0;font-size:14px;font-weight:700;letter-spacing:-.2px;z-index:3;user-select:none}
.status-icons{display:flex;align-items:center;gap:5px}
.status-icons svg{width:18px;height:16px;fill:currentColor}
.status-icons .battery{width:25px;height:14px}
.status-bar.is-room{background:var(--chat-bg)}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}
.list-header{height:70px;min-height:70px;padding:12px 21px 8px;display:flex;align-items:center;justify-content:space-between}
.list-title{font-size:27px;font-weight:760;letter-spacing:-1.3px}
.list-tools{display:flex;align-items:center;gap:17px}
.icon-btn{background:transparent;border:0;padding:4px;display:grid;place-items:center;color:#252525}
.icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.list-filter{margin:5px 19px 12px;display:flex;gap:18px;height:36px;align-items:center;font-weight:650;font-size:15px}
.list-filter .chosen{color:#181818;position:relative}
.list-filter .chosen:after{content:"";height:3px;width:100%;position:absolute;bottom:-8px;left:0;background:#1c1c1c;border-radius:3px}
.list-filter span:not(.chosen){color:#9a9a9a}
.list-body{flex:1;overflow:auto}
.chat-entry{display:flex;align-items:center;width:100%;gap:12px;text-align:left;background:#fff;border:0;padding:16px 19px 15px;min-height:88px}
.chat-entry:active{background:#f7f7f7}
.avatar{flex:none;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(145deg,#a69687,#d9c4b5 54%,#9c9691);display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center 38%;position:absolute;inset:0;display:none}
.avatar.has-photo img{display:block}
.avatar.large{width:55px;height:55px;border-radius:17px}
.avatar.small{width:38px;height:38px;border-radius:13px;font-size:13px}
.entry-main{min-width:0;flex:1}
.entry-title{font-size:16px;line-height:1.5;font-weight:650}
.entry-last{color:#969696;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:5px}
.entry-side{align-self:flex-start;display:flex;flex-direction:column;gap:9px;align-items:flex-end;margin-top:3px}
.entry-time{font-size:10.8px;color:#a4a4a4;white-space:nowrap}
.unread-badge{min-width:18px;height:18px;border-radius:100px;background:#ed5a4b;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.bottom-nav{height:68px;min-height:68px;border-top:1px solid #f3f3f3;display:flex;justify-content:space-around;align-items:center;color:#b8b8b8;background:#fafafa}
.nav-tab{width:20%;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}
.nav-tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-tab.active{color:#171717}
.home-footer{height:22px;min-height:22px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;background:#fafafa;z-index:4}
.home-footer.is-room{background:#fff}
.home-indicator{width:116px;height:4px;border-radius:99px;background:#171717}
/* Conversation */
#roomScreen{background:var(--chat-bg)}
.room-header{height:60px;min-height:60px;padding:2px 16px 7px 17px;display:flex;align-items:center;gap:13px;background:var(--chat-bg);border-bottom:1px solid rgba(28,40,52,.055);z-index:2}
.back-btn svg{width:27px;height:27px}
.room-name{font-size:17px;font-weight:690;flex:1;letter-spacing:-.2px}
.room-side{display:flex;gap:11px}
.messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:17px 12px 26px;scroll-behavior:smooth;scrollbar-width:none}
.messages::-webkit-scrollbar{display:none}
.day-marker{display:flex;align-items:center;justify-content:center;margin:2px auto 26px}
.day-marker span{border-radius:20px;background:rgba(56,72,90,.14);color:#f8fbfe;letter-spacing:-.15px;font-size:11px;padding:6px 13px}
.msg{display:flex;gap:7px;margin-bottom:10px;align-items:flex-start;animation:comeIn .22s ease-out both}
@keyframes comeIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.msg.mine{justify-content:flex-end;margin-left:25px}
.msg.theirs{margin-right:22px}
.profile-slot{width:38px;flex:none}
.profile-name{font-size:12px;color:#253344;margin:0 0 6px 1px;font-weight:550}
.msg-content{min-width:0;max-width:calc(100% - 54px);display:flex;flex-direction:column;align-items:flex-start}
.msg.mine .msg-content{align-items:flex-end;max-width:81%}
.bubble-row{display:flex;align-items:flex-end;gap:5px;max-width:100%}
.msg.mine .bubble-row{flex-direction:row-reverse}
.bubble{position:relative;padding:9px 11px 10px;font-size:15px;line-height:1.5;letter-spacing:-.35px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;width:max-content;min-width:26px;box-shadow:0 1px 1px rgba(30,40,60,.035)}
.msg.mine .bubble{background:var(--kakao);border-radius:12px 3px 12px 12px}
.msg.theirs .bubble{background:#fff;border-radius:3px 12px 12px 12px}
.msg-side{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:3px;flex:none;padding-bottom:2px}
.msg.mine .msg-side{align-items:flex-end}
.unread-num{color:#f9e217;font-size:11px;line-height:12px;font-weight:700;min-height:12px}
.msg-time{font-size:10px;color:#536476;white-space:nowrap;line-height:1.15;font-weight:450}
.translate-btn{border:0;background:rgba(247,250,253,.30);color:#465f77;border-radius:20px;padding:3px 9px;margin-top:4px;line-height:1.4;font-size:10px;letter-spacing:.1px;display:inline-flex;gap:4px;align-items:center}
.translate-btn:active,.translate-btn[aria-expanded="true"]{background:rgba(255,255,255,.63);color:#314457}
.translate-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6}
.translation{font-size:12px;line-height:1.58;padding:7px 9px 7px;border-radius:7px;background:rgba(255,255,255,.48);color:#36465a;margin-top:4px;max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine .translation{text-align:left}
/* Compose */
.compose-panel{background:#fff;z-index:3;box-shadow:0 -1px 0 rgba(255,255,255,.18)}
.next-hint{display:flex;align-items:center;justify-content:center;height:29px;padding:0 12px;background:rgba(248,249,251,.98);color:#7e8d9a;font-size:11px;gap:6px;white-space:nowrap}
.next-hint:before{content:"";width:5px;height:5px;border-radius:50%;background:#e9c600;flex:none}
.next-hint.waiting:before{background:#909da8;animation:blink 1s infinite alternate}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.compose-row{height:56px;display:flex;align-items:center;gap:8px;padding:7px 11px 8px}
.compose-plus{width:30px;height:32px;border:0;background:transparent;color:#929699;font-size:31px;font-weight:200;display:grid;place-items:center;line-height:1;padding:0}
.field-shell{height:38px;min-width:0;flex:1;border:1px solid #ededee;border-radius:20px;display:flex;align-items:center;background:#f9f9fa;position:relative;padding-left:11px}
.composer-input{border:0;background:none;outline:none!important;width:100%;min-width:0;font-size:13px;padding:6px 0;line-height:1.5;color:#111;resize:none;white-space:nowrap;overflow:hidden;cursor:pointer}
.composer-input::placeholder{color:#acacaf}
.field-smile{background:none;border:0;color:#a5a5a5;flex:none;padding:5px 6px}
.field-smile svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.send-btn{background:#f0f0f0;border:0;border-radius:10px;width:37px;height:37px;display:grid;place-items:center;color:#bababa;transition:background .15s,color .15s}
.send-btn.ready{background:var(--kakao);color:#343434;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.send-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* Fake iOS Korean keyboard */
.keyboard{height:258px;min-height:258px;background:#d4d7df;padding:5px 4px 10px;user-select:none;touch-action:manipulation;animation:keyIn .16s ease-out}
@keyframes keyIn{from{transform:translateY(30px);opacity:.65}to{transform:translateY(0);opacity:1}}
.keyboard-guide{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 13px;color:#59616f;font-size:13px}
.keyboard-guide span:nth-child(2){color:#7d8792;font-size:11px}
.key-line{display:flex;justify-content:center;gap:4px;margin:4px 0 8px;height:43px}
.key{appearance:none;border:0;background:#fff;color:#222;border-radius:5px;box-shadow:0 1px 0 #a6aab3;flex:1;text-align:center;font-size:19px;padding:0;display:grid;place-items:center}
.key.wide{flex:1.38;background:#aeb5c1;color:#26303a;font-size:15px}
.key.space{flex:4.5;font-size:14px}
.key.lang{font-size:12px}
.key.send-key{background:#b0b9c8;color:#273b53;flex:1.42;font-size:14px;font-weight:650}
.key.pressed{background:#f6efbd}
.keyboard.ended .key{opacity:.6}
/* Menu / toast */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:19px 23px 31px;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.sheet-title{font-weight:700;font-size:17px;margin-bottom:6px}
.sheet-sub{color:#8c8c8c;font-size:12px;margin-bottom:13px;line-height:1.6}
.sheet-action{width:100%;height:49px;border:0;border-bottom:1px solid #f1f1f1;text-align:left;background:#fff;color:#252525;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.sheet-close{margin-top:10px;background:#f3f3f3;border:0;border-radius:10px;width:100%;height:44px;color:#555}
.toast{position:absolute;z-index:12;bottom:93px;left:50%;transform:translate(-50%,8px);max-width:85%;border-radius:40px;background:rgba(33,40,47,.87);color:#fff;padding:9px 14px;font-size:12px;line-height:1.45;text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:normal}
.toast.show{opacity:1;transform:translate(-50%,0)}
.searchbox{padding:2px 19px 10px}
.searchbox input{width:100%;border:0;border-radius:12px;background:#f5f5f5;padding:10px 12px;font-size:13px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:600px){body{background:#fff}.phone{width:100%;height:100dvh;min-height:0;border-radius:0;box-shadow:none}.status-bar{height:calc(38px + env(safe-area-inset-top));min-height:calc(38px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top)}.home-footer{height:calc(18px + env(safe-area-inset-bottom));min-height:calc(18px + env(safe-area-inset-bottom));padding-bottom:max(6px,env(safe-area-inset-bottom))}.keyboard{height:260px;min-height:260px}}
@media(max-height:650px){.keyboard{height:214px;min-height:214px}.key-line{height:35px;margin-bottom:5px}.keyboard-guide{height:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:0.01ms!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
</style>

      <button class="sheet-action" id="sheetTranslations" type="button">번역 모두 표시 <span id="allTranslationsStatus">꺼짐</span></button>
      <button class="sheet-action" id="sheetPhoto" type="button">쭈 프로필 사진 넣기 <span>›</span></button>
      <button class="sheet-action" id="sheetExport" type="button">프로필 사진이 포함된 HTML 저장 <span>↓</span></button>
      <button class="sheet-close" id="sheetClose" type="button">닫기</button>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <input class="sr-only" id="photoPicker" type="file" accept="image/*" aria-label="프로필 사진 파일 선택">
</div>
<script>
(() => {
  'use strict';
  // Text is Korean in bubbles and Chinese in the optional translations.
  // "me" = 엄성현 (the phone owner's point of view); "them" = 김주훈 (쭈).
  const story = [
    {from:'me',ko:'김주훈, 너 오늘 입은 팬티 링크 좀 보내 줘',zh:'金主训你今天穿的内裤链接发我一下'},
    {from:'them',ko:'?',zh:'？'},
    {from:'them',ko:'뭐 하게??',zh:'干什么？？'},
    {from:'them',ko:'너 미쳤냐??? 이 변태야!',zh:'你有病吧？？？死变态！'},
    {from:'me',ko:'나도 그걸 묻고 싶거든',zh:'我也想问你'},
    {from:'me',ko:'왜 네 팬티가 내가 그저께 입었던 거랑 똑같은데',zh:'为什么这条内裤和我前天穿的那条一模一样'},
    {from:'them',ko:'……',zh:'……'},
    {from:'them',ko:'??!',zh:'？？！'},
    {from:'them',ko:'아……… 미안……………',zh:'哦………对不起……………'},
    {from:'me',ko:'너야말로 미친 거 아니야? 이 변태야!',zh:'你是不是有病啊死变态！'},
    {from:'them',ko:'잘못했어, 진짜 잘못했어',zh:'我错了我真错了'},
    {from:'them',ko:'아침에 드레스룸 들어갈 때 불 켜는 걸 깜빡했어',zh:'早上去衣帽间的时候忘记开灯了'},
    {from:'them',ko:'미안해, 진짜 미안해',zh:'对不起真对不起'},
    {from:'me',ko:'미안하면 다야?',zh:'对不起有用？'},
    {from:'them',ko:'그럼 내가 밥 살게, 어때?',zh:'那我请你吃饭行吗？'},
    {from:'me',ko:'밥만 사는 거야…',zh:'只是请吃饭啊…'},
    {from:'them',ko:'당연히 아니지',zh:'当然不是'},
    {from:'them',ko:'잠깐만 기다려 줘. 5분이면 돌아갈게',zh:'请稍等一下，我还有5分钟回来'},
    {from:'me',ko:'………',zh:'………'},
    {from:'me',ko:'날 만족시킬 만한 해결책을 가져오는 게 좋을 거야',zh:'你最好给我一个能让我满意的解决方法'},
    {from:'them',ko:'당연히 문제없지, 사랑하는 내 남자친구야',zh:'当然没问题亲爱的男朋友'},
    {from:'me',ko:'?',zh:'？'},
    {from:'me',ko:'사랑하는?',zh:'亲爱的？'},
    {from:'me',ko:'으, 징그러워! 지금 무슨 낯짝으로 그런 소릴 해……',zh:'好恶心喔！你什么嘴脸嘛……'},
    {from:'them',ko:'네 비위 맞추는 낯짝이지',zh:'讨好你的嘴脸'},
    {from:'me',ko:'……',zh:'……'},
    {from:'them',ko:'나 진짜 잘못했다니까아',zh:'我真的错了嘛'},
    {from:'me',ko:'알았어. 오는 길 조심해',zh:'好吧，你路上注意安全'},
    {from:'them',ko:'응~',zh:'好～'},
    {from:'them',ko:'❤️',zh:'❤️'}
  ];
  const byId = id => document.getElementById(id);
  const els = {
    list:byId('listScreen'),room:byId('roomScreen'),chatEntry:byId('chatEntry'),goBack:byId('goBack'),
    statusBar:byId('statusBar'),homeFooter:byId('homeFooter'),scroll:byId('messageScroll'),
    input:byId('composerInput'),field:byId('fieldShell'),keyboard:byId('keyboard'),send:byId('sendBtn'),
    hint:byId('nextHint'),entryPreview:byId('entryPreview'),entryTime:byId('entryTime'),
    overlay:byId('overlay'),toast:byId('toast'),photoPicker:byId('photoPicker'),
    guide:byId('keyboardGuide'),day:byId('dayLabel'),searchInput:byId('searchInput')
  };
  let index=0, busy=false, composing=false, typeTimer=null, activeDraft='', toastTimer=null, showAll=false, latestIncoming=false, enteredRoom=false, runId=0;
  // Outgoing message "1" marks are cleared when 쭈 actually reads them,
  // just before his next reply. Consecutive outgoing messages are read together.
  const pendingUnreads=[];
  function markRead(){
    for(const unread of pendingUnreads){unread.textContent='';unread.removeAttribute('aria-label');}
    pendingUnreads.length=0;
  }
  function later(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
  // A fictional, continuously advancing clock, always anchored to
  // Saturday 7 November 2026, 19:32 (not the device's real date or timezone).
  const sceneStart = new Date(2026,10,7,19,32,0);
  let sceneElapsedSeconds=0;
  let lastRealTick=Date.now();
  let lastMessageSeconds=-1;
  const timeSpeeds=[{rate:4,label:'4배'},{rate:10,label:'10배'},{rate:1,label:'실시간'}];
  let timeSpeedIndex=0;
  function sceneDate(){return new Date(sceneStart.getTime()+Math.floor(sceneElapsedSeconds)*1000);}
  function pad2(n){return String(n).padStart(2,'0');}
  function formatTime(date=sceneDate()){
    const hour=date.getHours();
    return `${hour<12?'오전':'오후'} ${hour%12||12}:${pad2(date.getMinutes())}`;
  }
  function renderSceneClock(){
    const t=sceneDate();
    byId('systemClock').textContent=`${pad2(t.getHours())}:${pad2(t.getMinutes())}`;
  }
  function syncSceneClock(){
    const now=Date.now();
    const realDelta=Math.max(0,Math.min((now-lastRealTick)/1000,5));
    lastRealTick=now;
    if(!document.hidden){sceneElapsedSeconds+=realDelta*timeSpeeds[timeSpeedIndex].rate;}
    renderSceneClock();
  }
  function advanceScene(seconds){
    syncSceneClock();sceneElapsedSeconds+=seconds;renderSceneClock();
  }
  // A minute on the fake phone takes 15 seconds at the default 4x speed.
  setInterval(syncSceneClock,800);
  document.addEventListener('visibilitychange',()=>{lastRealTick=Date.now();renderSceneClock();});
  renderSceneClock();
  els.day.textContent='2026년 11월 7일 토요일';
  async function fastForwardFiveMinutes(myRun){
    // In the story 쭈 says "5분이면 돌아갈게". Briefly animate his five-minute trip
    // instead of making the reader wait five minutes in real time.
    for(let i=0;i<20;i++){
      if(myRun!==runId)return false;
      advanceScene(15);
      await later(110);
    }
    return myRun===runId;
  }
  function toast(s){clearTimeout(toastTimer);els.toast.textContent=s;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2100);}
  function scrollBottom(){requestAnimationFrame(()=>{els.scroll.scrollTop=els.scroll.scrollHeight;});}
  function setReady(ready){els.send.classList.toggle('ready',!!ready);els.send.setAttribute('aria-disabled',String(!ready));}
  function showRoom(){enteredRoom=true;els.list.hidden=true;els.room.hidden=false;els.statusBar.classList.add('is-room');els.homeFooter.classList.add('is-room');scrollBottom();updateHint();}
  function showList(){enteredRoom=false;hideKeyboard();els.room.hidden=true;els.list.hidden=false;els.statusBar.classList.remove('is-room');els.homeFooter.classList.remove('is-room');}
  els.chatEntry.addEventListener('click',showRoom);els.goBack.addEventListener('click',showList);
  function updateHint(){
    els.hint.classList.toggle('waiting',busy);
    if(index>=story.length){els.hint.textContent='대화가 끝났어요 · ☰ 메뉴에서 다시 보기';els.input.placeholder='대화가 끝났습니다';}
    else if(busy){els.hint.textContent='쭈의 답장을 기다리는 중…';els.input.placeholder='답장을 기다리는 중…';}
    else if(composing){els.hint.textContent='메시지가 자동으로 입력됐어요 · 노란 버튼으로 전송';els.input.placeholder='메시지 입력';}
    else{els.hint.textContent=index===0?'입력창을 누르면 첫 메시지가 자동으로 입력돼요':'입력창을 눌러 다음 메시지를 작성하세요';els.input.placeholder='메시지 입력';}
  }
  function hideKeyboard(){els.keyboard.hidden=true;composing=false;if(typeTimer){clearInterval(typeTimer);typeTimer=null;}activeDraft='';els.input.value='';setReady(false);els.input.blur();updateHint();scrollBottom();}
  function fillDraft(instant=false){
    if(index>=story.length||busy||story[index].from!=='me')return;
    if(typeTimer){clearInterval(typeTimer);typeTimer=null;}
    const full=story[index].ko;
    if(instant){els.input.value=full;activeDraft=full;els.guide.textContent='입력 완료';setReady(true);updateHint();return;}
    els.input.value='';activeDraft='';setReady(false);els.guide.textContent='한국어 자동 입력 중…';
    const letters=Array.from(full);let i=0;
    typeTimer=setInterval(()=>{
      i=Math.min(i+2,letters.length);activeDraft=letters.slice(0,i).join('');els.input.value=activeDraft;
      if(i>=letters.length){clearInterval(typeTimer);typeTimer=null;els.guide.textContent='전송할 준비가 됐어요';setReady(true);updateHint();}
    },31);
  }
  function openKeyboard(){
    if(index>=story.length){toast('대화가 끝났어요. 메뉴에서 다시 시작할 수 있어요.');return;}
    if(busy){toast('쭈의 답장을 기다려 주세요');return;}
    if(story[index].from!=='me')return;
    if(composing)return;
    composing=true;els.keyboard.hidden=false;updateHint();scrollBottom();fillDraft();
  }
  els.input.addEventListener('click',openKeyboard);els.field.addEventListener('click',e=>{if(!e.target.closest('button'))openKeyboard();});
  els.input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendCurrent();}});
  byId('emojiBtn').addEventListener('click',()=>{if(!composing)openKeyboard();else toast('이 대화는 미리 정해진 메시지로 진행돼요');});
  function makeMessage(item){
    const me=item.from==='me';const container=document.createElement('article');container.className=`msg ${me?'mine':'theirs'}`;
    const prev=els.scroll.querySelector('.msg:last-of-type');
    const grouped=prev&&prev.dataset.from===item.from;
    container.dataset.from=item.from;
    if(!me){
      const slot=document.createElement('div');slot.className='profile-slot';
      if(!grouped){const avatar=document.createElement('div');avatar.className='avatar small';avatar.dataset.avatar='';avatar.innerHTML='<span>쭈</span><img alt="">';slot.appendChild(avatar);attachAvatar(avatar);}
      container.appendChild(slot);
    }
    const content=document.createElement('div');content.className='msg-content';
    if(!me&&!grouped){const name=document.createElement('div');name.className='profile-name';name.textContent='쭈';content.appendChild(name);}
    const row=document.createElement('div');row.className='bubble-row';
    const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=item.ko;
    const side=document.createElement('div');side.className='msg-side';
    // A few seconds pass between sent messages, even when a reader taps very fast.
    syncSceneClock();
    if(lastMessageSeconds>=0){
      const gap=item.from==='me'?22:16;
      if(sceneElapsedSeconds<lastMessageSeconds+gap){
        sceneElapsedSeconds=lastMessageSeconds+gap;
        renderSceneClock();
      }
    }
    lastMessageSeconds=sceneElapsedSeconds;
    const sentAt=sceneDate();
    if(me){const unread=document.createElement('span');unread.className='unread-num';unread.textContent='1';unread.setAttribute('aria-label','안 읽음');side.appendChild(unread);pendingUnreads.push(unread);}
    const time=document.createElement('span');time.className='msg-time';time.textContent=formatTime(sentAt);side.appendChild(time);
    row.append(bubble,side);content.appendChild(row);
    const tBtn=document.createElement('button');tBtn.className='translate-btn';tBtn.type='button';tBtn.setAttribute('aria-expanded',String(showAll));tBtn.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h9M6.5 2v2m3 0c0 4-2.1 6.4-6.8 8.5M4.1 6.2c1.2 2.1 3.3 4.1 5.9 5.5M10.7 10.3l2 4m-4-1h6"/></svg> 번역';
    tBtn.setAttribute('aria-label','중국어 번역 보기');
    const translated=document.createElement('div');translated.className='translation';translated.textContent=item.zh;translated.hidden=!showAll;
    tBtn.addEventListener('click',()=>{const show=translated.hidden;translated.hidden=!show;tBtn.setAttribute('aria-expanded',String(show));scrollBottom();});
    content.append(tBtn,translated);container.appendChild(content);
    els.scroll.appendChild(container);els.entryPreview.textContent=item.ko;els.entryTime.textContent=formatTime(sentAt);
    latestIncoming=!me;scrollBottom();return container;
  }
  async function replyFromJuhoon(){
    const myRun=runId;
    busy=true;updateHint();
    await later(1050);
    if(myRun!==runId)return;
    markRead();
    // After the two impatient messages from 엄성현, let 쭈's promised
    // five-minute return pass on the fictional clock before he answers.
    if(index===20){
      if(!await fastForwardFiveMinutes(myRun))return;
    }else{
      await later(380);
    }
    if(myRun!==runId)return;
    while(index<story.length&&story[index].from==='them'){
      if(myRun!==runId)return;
      makeMessage(story[index]);index++;
      await later(index>=story.length?500:story[index].from==='them'?690+Math.floor(Math.random()*380):480);
    }
    if(myRun!==runId)return;
    busy=false;updateHint();
    if(index>=story.length)toast('❤️');
  }
  function sendCurrent(){
    if(!composing||busy||index>=story.length||story[index].from!=='me')return;
    if(typeTimer){fillDraft(true);return;}
    if(!els.input.value.trim())return;
    makeMessage(story[index]);index++;
    hideKeyboard();
    if(index<story.length&&story[index].from==='them')replyFromJuhoon();
    else updateHint();
  }
  els.send.addEventListener('click',()=>{
    if(!composing){openKeyboard();return;}
    sendCurrent();
  });
  els.keyboard.addEventListener('click',e=>{
    const key=e.target.closest('[data-key]');if(!key)return;
    key.classList.add('pressed');setTimeout(()=>key.classList.remove('pressed'),110);
    const what=key.dataset.key;
    if(what==='send'){sendCurrent();return;}
    if(!composing)return;
    if(typeTimer)fillDraft(true);
    if(what==='delete')els.input.value=Array.from(els.input.value).slice(0,-1).join('');
    else if(what==='space')els.input.value+=' ';
    else if(['shift','123','globe'].includes(what)){toast('한글 키보드 · 자동 입력 모드');return;}
    else els.input.value+=what;
    activeDraft=els.input.value;setReady(!!activeDraft.trim());
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!els.overlay.hidden){els.overlay.hidden=true;}else if(composing)hideKeyboard();else if(enteredRoom)showList();}});
  // List filtering
  byId('searchOpen').addEventListener('click',()=>{const panel=byId('searchbox');panel.hidden=!panel.hidden;if(!panel.hidden)els.searchInput.focus();});
  els.searchInput.addEventListener('input',()=>{els.chatEntry.hidden=!('쭈 김주훈 Juhoon'.toLowerCase().includes(els.searchInput.value.trim().toLowerCase()));});
  byId('roomSearch').addEventListener('click',()=>toast('메시지 번역은 각 말풍선 아래에서 볼 수 있어요'));
  function openMenu(){els.overlay.hidden=false;byId('allTranslationsStatus').textContent=showAll?'켜짐':'꺼짐';}
  byId('roomMenu').addEventListener('click',openMenu);byId('listSettings').addEventListener('click',openMenu);
  byId('sheetClose').addEventListener('click',()=>els.overlay.hidden=true);
  els.overlay.addEventListener('click',e=>{if(e.target===els.overlay)els.overlay.hidden=true;});
  function replay(){
    runId++;
    pendingUnreads.length=0;
    sceneElapsedSeconds=0;lastMessageSeconds=-1;lastRealTick=Date.now();renderSceneClock();
    index=0;busy=false;hideKeyboard();
    els.scroll.querySelectorAll('.msg').forEach(m=>m.remove());
    els.entryPreview.textContent='대화를 시작해 보세요';els.entryTime.textContent='';
    showAll=false;byId('allTranslationsStatus').textContent='꺼짐';els.overlay.hidden=true;updateHint();scrollBottom();
    toast('처음부터 다시 시작합니다');
  }
  byId('sheetReplay').addEventListener('click',replay);
  byId('sheetTimeSpeed').addEventListener('click',()=>{
    syncSceneClock();
    timeSpeedIndex=(timeSpeedIndex+1)%timeSpeeds.length;
    byId('timeSpeedStatus').textContent=timeSpeeds[timeSpeedIndex].label;
  });
  byId('sheetTranslations').addEventListener('click',()=>{
    showAll=!showAll;
    document.querySelectorAll('.translation').forEach(x=>x.hidden=!showAll);
    document.querySelectorAll('.translate-btn').forEach(x=>x.setAttribute('aria-expanded',String(showAll)));
    byId('allTranslationsStatus').textContent=showAll?'켜짐':'꺼짐';scrollBottom();
  });
  // Standalone image data is stored inside this HTML. No external image paths.
  const avatarStorageKey='kkt_jju_profile_photo_v2';
  let portrait=(byId('embedded-avatar')?.textContent||'').trim();
  if(!portrait){try{portrait=localStorage.getItem(avatarStorageKey)||'';}catch(e){}}
  function attachAvatar(el){const img=el.querySelector('img');if(!img)return;const src=portrait;
    img.onload=()=>el.classList.add('has-photo');img.onerror=()=>el.classList.remove('has-photo');img.src=src;
  }
  function refreshAvatars(){document.querySelectorAll('[data-avatar]').forEach(attachAvatar);}
  refreshAvatars();
  function selectPhoto(){els.overlay.hidden=true;els.photoPicker.click();}
  byId('sheetPhoto').addEventListener('click',selectPhoto);
  function saveSelfContainedHTML(){
    if(!portrait||!portrait.startsWith('data:image/')){
      els.overlay.hidden=true;selectPhoto();
      toast('먼저 프로필 사진을 선택해 주세요');
      return;
    }
    // Clone document source; store the portrait as text so no HTML dependencies remain.
    const root=document.documentElement.cloneNode(true);
    const marker=root.querySelector('#embedded-avatar');
    marker.textContent=portrait;
    // Export a pristine chat, not whatever state the user reached before saving.
    root.querySelectorAll('.msg').forEach(el=>el.remove());
    root.querySelector('#listScreen').removeAttribute('hidden');
    root.querySelector('#roomScreen').setAttribute('hidden','');
    root.querySelector('#statusBar').classList.remove('is-room');
    root.querySelector('#homeFooter').classList.remove('is-room');
    root.querySelector('#keyboard').setAttribute('hidden','');
    root.querySelector('#overlay').setAttribute('hidden','');
    root.querySelector('#searchbox').setAttribute('hidden','');
    root.querySelector('#entryPreview').textContent='대화를 시작해 보세요';
    root.querySelector('#entryTime').textContent='';
    root.querySelector('#systemClock').textContent='19:32';
    root.querySelector('#timeSpeedStatus').textContent='4배';
    root.querySelector('#nextHint').textContent='입력창을 누르면 첫 메시지가 자동으로 입력돼요';
    root.querySelector('#nextHint').classList.remove('waiting');
    root.querySelector('#composerInput').setAttribute('placeholder','메시지 입력');
    root.querySelector('#sendBtn').classList.remove('ready');
    root.querySelector('#toast').classList.remove('show');
    root.querySelector('#toast').textContent='';
    root.querySelector('#allTranslationsStatus').textContent='꺼짐';
    root.querySelectorAll('[data-avatar]').forEach(el=>el.classList.remove('has-photo'));
    root.querySelectorAll('[data-avatar] img').forEach(el=>el.removeAttribute('src'));
    const output='<!DOCTYPE html>\n'+root.outerHTML;
    const blob=new Blob([output],{type:'text/html;charset=utf-8'});
    const link=document.createElement('a');
    link.href=URL.createObjectURL(blob);
    link.download='kkt_쭈_头像已内嵌.html';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(link.href),2000);
    els.overlay.hidden=true;
    toast('사진을 HTML 안에 저장했어요');
  }
  byId('sheetExport').addEventListener('click',saveSelfContainedHTML);
  byId('plusBtn').addEventListener('click',()=>toast('오른쪽 위 메뉴에서 프로필 사진을 바꿀 수 있어요'));
  els.photoPicker.addEventListener('change',()=>{
    const f=els.photoPicker.files&&els.photoPicker.files[0];if(!f)return;
    if(!f.type.startsWith('image/')){toast('이미지를 골라 주세요');return;}
    const reader=new FileReader();reader.onload=()=>{
      const im=new Image();im.onload=()=>{
        const cv=document.createElement('canvas');const s=256;cv.width=s;cv.height=s;
        const ctx=cv.getContext('2d');const dim=Math.min(im.naturalWidth,im.naturalHeight);
        const sx=(im.naturalWidth-dim)/2,sy=(im.naturalHeight-dim)*.32;
        ctx.drawImage(im,sx,sy,dim,dim,0,0,s,s);
        portrait=cv.toDataURL('image/jpeg',.82);
        try{localStorage.setItem(avatarStorageKey,portrait);}catch(e){}
        refreshAvatars();toast('사진이 적용됐어요 · ☰ 메뉴에서 HTML을 저장하세요');
      };im.src=reader.result;
    };reader.readAsDataURL(f);
  });
  updateHint();
})();
</script>
</body>
</html>
